name: GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: actions/configure-pages@v6
      - run: python scripts/build_public_site.py --output _site
      - run: >-
          python -c "import json,pathlib;
          p=pathlib.Path('_site');
          c=json.loads((p/'runtime-config.json').read_text());
          assert c == {'mode':'PUBLIC','localApiAvailable':False,'apiBase':None};
          assert not any(p.rglob('*.sqlite*'));
          assert not any(p.rglob('config.local.json'))"
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v5
