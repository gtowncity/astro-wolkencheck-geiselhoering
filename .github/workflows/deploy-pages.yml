name: GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v7

      - name: GitHub Pages konfigurieren
        uses: actions/configure-pages@v6

      - name: Öffentliches Seitenartefakt zusammenstellen
        shell: bash
        run: |
          set -euo pipefail
          mkdir _site
          cp index.html 404.html .nojekyll site-build-info.json _site/

      - name: GitHub-Pages-Artefakt hochladen
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

      - name: GitHub Pages veröffentlichen
        id: deployment
        uses: actions/deploy-pages@v5
