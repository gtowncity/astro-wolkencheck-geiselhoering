name: Feature CI

on:
  push:
    branches:
      - feature/dwd-nowcast-v4.3
      - feature/ui-live-dashboard-v4.3
      - feature/forecast-loading-layout-v4.3
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: feature-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  safety-core:
    name: Safety core (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - run: python -m ruff check nowcast_service scripts tests
      - name: Run Mypy
        id: mypy
        continue-on-error: true
        run: python -m mypy nowcast_service scripts > mypy-report.txt 2>&1
      - name: Upload Mypy diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mypy-report-${{ matrix.os }}
          path: mypy-report.txt
          if-no-files-found: error
      - name: Fail when Mypy failed
        if: steps.mypy.outcome == 'failure'
        run: python -c "import sys; sys.exit(1)"
      - run: python -m pytest -m "not e2e" --cov=nowcast_service --cov-branch --cov-report=term-missing --cov-fail-under=90
      - run: python scripts/build_public_site.py --output public-test

  browser-e2e:
    name: Local/public browser safety UI
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - run: python -m playwright install --with-deps chromium
      - name: Run browser tests
        id: browser-tests
        continue-on-error: true
        run: python -m pytest -m e2e --junitxml=browser-report.xml
      - name: Upload browser diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-report
          path: browser-report.xml
          if-no-files-found: error
      - name: Upload visual review screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: forecast-satellite-ui-screenshots
          path: test-artifacts/*.png
          if-no-files-found: warn
      - name: Fail when browser tests failed
        if: steps.browser-tests.outcome == 'failure'
        run: python -c "import sys; sys.exit(1)"
