name: Feature CI

on:
  push:
    branches:
      - feature/dwd-nowcast-v4.3
      - feature/ui-live-dashboard-v4.3
      - feature/forecast-loading-layout-v4.3
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: feature-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  safety-core:
    name: Safety core (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - name: Run Ruff
        id: ruff
        continue-on-error: true
        run: >-
          python -m ruff check nowcast_service scripts tests
          --output-format json
          --output-file ruff-report.json
      - name: Upload Ruff diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ruff-report-${{ matrix.os }}
          path: ruff-report.json
          if-no-files-found: error
      - name: Fail when Ruff failed
        if: steps.ruff.outcome == 'failure'
        run: python -c "import sys; sys.exit(1)"
      - run: python -m mypy nowcast_service scripts
      - run: python -m pytest -m "not e2e" --cov=nowcast_service --cov-branch --cov-report=term-missing --cov-fail-under=90
      - run: python scripts/build_public_site.py --output public-test

  browser-e2e:
    name: Local/public browser safety UI
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - run: python -m playwright install --with-deps chromium
      - run: python -m pytest -m e2e
      - name: Upload visual review screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: forecast-satellite-ui-screenshots
          path: test-artifacts/*.png
          if-no-files-found: warn
