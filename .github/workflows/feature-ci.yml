name: Feature CI

on:
  push:
    branches:
      - feature/dwd-nowcast-v4.3
      - feature/ui-live-dashboard-v4.3
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: feature-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  safety-core:
    name: Safety core (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - run: python -m ruff check nowcast_service scripts tests
      - run: python -m mypy nowcast_service scripts
      - name: Run core tests
        id: core-tests
        continue-on-error: true
        run: >-
          python -m pytest -m "not e2e"
          --junitxml=pytest-report.xml
          --cov=nowcast_service
          --cov-branch
          --cov-report=term-missing
          --cov-report=xml:coverage.xml
          --cov-fail-under=90
      - name: Upload core test diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: core-test-report-${{ matrix.os }}
          path: |
            pytest-report.xml
            coverage.xml
          if-no-files-found: error
      - name: Fail when core tests failed
        if: steps.core-tests.outcome == 'failure'
        run: exit 1
      - run: python scripts/build_public_site.py --output public-test

  browser-e2e:
    name: Local/public browser safety UI
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - run: python -m playwright install --with-deps chromium
      - run: python -m pytest -m e2e
