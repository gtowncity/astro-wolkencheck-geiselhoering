name: DWD CAP Live Source Smoke

on:
  workflow_dispatch:
  push:
    branches: [feature/dwd-nowcast-v4.3]
    paths:
      - .github/workflows/live-cap-smoke.yml
      - scripts/inspect_dwd_cap.py
      - nowcast_service/sources/dwd_cap_directory.py
      - nowcast_service/sources/cap_parser.py
      - nowcast_service/sources/cap_snapshot.py
      - nowcast_service/sources/cap_runtime.py
      - nowcast_service/downloads/remote.py
      - nowcast_service/downloads/safe_zip.py
      - pyproject.toml
permissions:
  contents: read
jobs:
  inspect-cap:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
      - run: python scripts/inspect_dwd_cap.py --output live-report/dwd-cap.json
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dwd-cap-source-verification
          path: live-report/dwd-cap.json
          if-no-files-found: warn
          retention-days: 7
