name: DWD Live Source Smoke

on:
  workflow_dispatch:
  push:
    branches: [feature/dwd-nowcast-v4.3]
    paths:
      - .github/workflows/live-source-smoke.yml
      - scripts/inspect_dwd_radar.py
      - nowcast_service/sources/dwd_directory.py
      - nowcast_service/sources/radar_hdf5.py
      - nowcast_service/sources/radar_analysis.py
      - nowcast_service/sources/radar_runtime.py
      - nowcast_service/downloads/remote.py
      - nowcast_service/downloads/safe_tar.py
permissions:
  contents: read
jobs:
  inspect-radar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: |
          python -m pip install "httpx>=0.28,<1" "h5py>=3.14,<4" "numpy>=2.2,<3"
          python -m pip install --no-deps -e .
      - run: python scripts/inspect_dwd_radar.py --output live-report/dwd-radar.json
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dwd-radar-source-verification
          path: live-report/dwd-radar.json
          if-no-files-found: warn
          retention-days: 7
