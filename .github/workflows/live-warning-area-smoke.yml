name: DWD Warning Area Live Smoke

on:
  workflow_dispatch:
  push:
    branches:
      - feature/dwd-nowcast-v4.3
    paths:
      - .github/workflows/live-warning-area-smoke.yml
      - scripts/inspect_dwd_warning_areas.py

permissions:
  contents: read

concurrency:
  group: dwd-warning-area-live-smoke
  cancel-in-progress: true

jobs:
  inspect-warning-area:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Repository auschecken
        uses: actions/checkout@v6

      - name: Python 3.12 einrichten
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Minimale Prüfabhängigkeiten installieren
        run: python -m pip install "httpx>=0.28,<1" "shapely>=2.1,<3"

      - name: Offizielle Warngebietsgeometrie prüfen
        run: >-
          python scripts/inspect_dwd_warning_areas.py
          --output live-report/dwd-warning-area.json

      - name: Prüfbericht hochladen
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dwd-warning-area-source-verification
          path: live-report/dwd-warning-area.json
          if-no-files-found: warn
          retention-days: 7
