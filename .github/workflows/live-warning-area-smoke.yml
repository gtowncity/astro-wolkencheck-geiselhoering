name: DWD Warning Area Live Smoke

on:
  workflow_dispatch:
  push:
    branches: [feature/dwd-nowcast-v4.3]
    paths:
      - .github/workflows/live-warning-area-smoke.yml
      - scripts/inspect_dwd_warning_areas.py
      - nowcast_service/sources/warning_area_index.py
      - nowcast_service/sources/cap_runtime.py
permissions:
  contents: read
jobs:
  inspect-warning-area:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python -m pip install "httpx>=0.28,<1" "shapely>=2.1,<3"
      - run: python scripts/inspect_dwd_warning_areas.py --output live-report/dwd-warning-area.json
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dwd-warning-area-source-verification
          path: live-report/dwd-warning-area.json
          if-no-files-found: warn
          retention-days: 7
