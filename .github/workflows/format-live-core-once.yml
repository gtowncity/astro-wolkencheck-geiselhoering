name: Format Live Core Once

on:
  push:
    branches:
      - feature/dwd-nowcast-v4.3
    paths:
      - .github/workflows/format-live-core-once.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v6
        with:
          ref: feature/dwd-nowcast-v4.3
          fetch-depth: 0

      - name: Python 3.12 einrichten
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Ruff installieren
        run: python -m pip install "ruff==0.12.11"

      - name: Quellen und Tests formatieren
        run: |
          python -m ruff format nowcast_service tests scripts/build_public_site.py
          python -m ruff check --fix nowcast_service tests scripts/build_public_site.py

      - name: Einmaligen Workflow entfernen und committen
        shell: bash
        run: |
          rm .github/workflows/format-live-core-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "style: normalize live core sources"
          git push origin HEAD:feature/dwd-nowcast-v4.3
