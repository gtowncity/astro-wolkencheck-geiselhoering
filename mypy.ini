[mypy]
python_version = 3.12
strict = True
warn_unused_configs = True

[mypy-defusedxml]
ignore_missing_imports = True

[mypy-defusedxml.*]
ignore_missing_imports = True

[mypy-h5py]
ignore_missing_imports = True

[mypy-h5py.*]
ignore_missing_imports = True

[mypy-shapely]
ignore_missing_imports = True

[mypy-shapely.*]
ignore_missing_imports = True

[mypy-nowcast_service.sources.warning_area_index]
# Shapely's geometry factory and JSON runtime narrowing cross untyped library
# boundaries. Runtime schema validation and dedicated tests remain mandatory.
warn_return_any = False
warn_unreachable = False
